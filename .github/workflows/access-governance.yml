name: Access governance checks

on:
  push:
    paths:
      - "access-governance/**"
      - ".github/workflows/access-governance.yml"
  pull_request:
    paths:
      - "access-governance/**"
      - ".github/workflows/access-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: access-governance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      # The sample data deliberately contains violations, so the scans run with
      # --fail-on none here. Point these at exported policies from a real estate
      # and drop the flag to gate on findings.
      - name: Scan samples
        run: |
          mkdir -p out
          python -m agp iam-scan --policy samples/iam-policy.json \
            --config config/governance-policy.yaml \
            --out out/iam-findings.md --fail-on none
          python -m agp access-review --policy samples/iam-policy.json \
            --roster samples/roster.csv --config config/governance-policy.yaml \
            --out out/access-review.md --csv out/access-review.csv --fail-on none
          python -m agp privacy-scan --inventory samples/data-inventory.yaml \
            --config config/governance-policy.yaml \
            --out out/privacy-findings.md --fail-on none
          python -m agp ropa --inventory samples/data-inventory.yaml --out out/ropa.md

      - name: Summarise in the job log
        run: cat out/iam-findings.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: governance-reports
          path: access-governance/out/
